<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Gohon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Outfit:wght@300;500&display=swap">
<style>
  /* Layout: one centered stage. A sealed record sleeve opens into a spinning 45 and the greeting. Single dark theme by choice. */
  :root {
    --night: #1b1630;
    --night-2: #2a2147;
    --rose: #ff8fab;
    --gold: #ffd27a;
    --ink: #f6eefc;
    --muted: #b9acd6;
    --display: "Yellowtail", "Brush Script MT", cursive;
    --body: "Outfit", system-ui, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { min-height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, var(--night-2), var(--night) 70%);
    background-color: var(--night);
    color: var(--ink);
    font-family: var(--body);
    font-weight: 300;
    display: grid;
    place-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    box-sizing: border-box;
    padding: 32px 16px;
    overflow-x: hidden;
  }
  canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .stage { position: relative; display: grid; justify-items: center; gap: 28px; text-align: center; max-width: 34rem; }

  /* Before opening */
  .gate { display: grid; justify-items: center; gap: 20px; }
  .gate p { margin: 0; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; font-size: .8rem; }
  .gate h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(2.6rem, 9vw, 4rem); color: var(--rose); line-height: 1.1; }
  button.open {
    font: 500 1rem var(--body);
    color: var(--night);
    background: var(--gold);
    border: 0;
    border-radius: 999px;
    padding: 14px 30px;
    cursor: pointer;
    box-shadow: 0 0 0 0 rgba(255, 210, 122, .6);
    animation: pulse 2s infinite;
  }
  button.open:focus-visible, .sound:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 18px rgba(255, 210, 122, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 210, 122, 0); } }

  /* After opening */
  .wish { display: grid; justify-items: center; gap: 22px; animation: rise 1.2s ease both; }
  @keyframes rise { from { opacity: .0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  .record {
    width: min(52vw, 210px);
    aspect-ratio: 1;
    max-width: 100%;
    border-radius: 50%;
    background:
      radial-gradient(circle, var(--night) 0 4%, var(--rose) 4.5% 30%, transparent 30.5%),
      repeating-radial-gradient(circle, #111 0 2px, #1d1d1d 2px 4px);
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    animation: spin 1.8s linear infinite;
    display: grid;
    place-items: center;
  }
  .record span { font-family: var(--display); color: var(--night); font-size: 1.1rem; transform: translateY(1.5em); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .wish h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(3rem, 12vw, 5.2rem); line-height: 1; color: var(--rose); text-wrap: balance; }
  .wish h1 em { display: block; font-style: normal; color: var(--gold); font-size: 1.15em; }
  .wish p { margin: 0; font-size: 1.1rem; line-height: 1.65; color: var(--ink); max-width: 30rem; }
  .wish .sign { color: var(--muted); font-size: .95rem; }
  .now { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

  .sound {
    position: fixed;
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    font: 500 .85rem var(--body);
    color: var(--ink);
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    .record, button.open, .wish { animation: none; }
  }
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<main class="stage">
  <div class="gate" id="gate">
    <p>Something for you</p>
    <h1>Gohon, tap to open</h1>
    <button class="open" id="openBtn" type="button">Open your surprise</button>
  </div>

  <div class="wish" id="wish" hidden>
    <div class="record" aria-hidden="true"><span>Gohon</span></div>
    <div class="now">Now playing · Somethin' Stupid</div>
    <h1>Happy Twenty One <em>Gohon!</em></h1>
    <p>Wishing you a year full of laughter, good songs and everything that makes you happy. Thank you for being such a close friend. I'm so glad you exist.</p>
    <p class="sign">Have the best day ever 🎂</p>
  </div>
</main>

<button class="sound" id="soundBtn" type="button" hidden>Pause music</button>
<audio id="song" src="song.mp4" loop preload="auto"></audio>

<script>
  const gate = document.getElementById('gate');
  const wish = document.getElementById('wish');
  const song = document.getElementById('song');
  const soundBtn = document.getElementById('soundBtn');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  document.getElementById('openBtn').addEventListener('click', () => {
    song.volume = 0.8;
    song.play().catch(() => {});
    gate.hidden = true;
    wish.hidden = false;
    soundBtn.hidden = false;
    if (!reduce) confetti();
  });

  soundBtn.addEventListener('click', () => {
    if (song.paused) { song.play().catch(() => {}); soundBtn.textContent = 'Pause music'; }
    else { song.pause(); soundBtn.textContent = 'Play music'; }
  });

  function confetti() {
    const c = document.getElementById('confetti');
    const ctx = c.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const resize = () => { c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
    resize(); addEventListener('resize', resize);
    const colors = ['#ff8fab', '#ffd27a', '#f6eefc', '#9ad8ff', '#c7a6ff'];
    const bits = Array.from({ length: 160 }, () => ({
      x: Math.random() * innerWidth,
      y: -20 - Math.random() * innerHeight,
      w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
      vy: 1.5 + Math.random() * 2.5, vx: -1 + Math.random() * 2,
      r: Math.random() * Math.PI, vr: -0.1 + Math.random() * 0.2,
      color: colors[Math.floor(Math.random() * colors.length)]
    }));
    const start = performance.now();
    (function frame(t) {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      const keepGoing = t - start < 7000;
      let alive = 0;
      for (const b of bits) {
        b.x += b.vx; b.y += b.vy; b.r += b.vr;
        if (b.y > innerHeight + 20 && keepGoing) { b.y = -20; b.x = Math.random() * innerWidth; }
        if (b.y <= innerHeight + 20) alive++;
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);
        ctx.fillStyle = b.color; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
        ctx.restore();
      }
      if (alive) requestAnimationFrame(frame);
    })(start);
  }
</script>
</body>
</html>
